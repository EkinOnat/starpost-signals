version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Keep dependency changes intentional and branch-light. Review upgrades on
    # the long-lived development branch instead of opening automatic PRs.
    open-pull-requests-limit: 0
    groups:
      frontend-and-indexer:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
